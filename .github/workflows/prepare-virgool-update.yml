name: Prepare Virgool Update for Review

on:
  workflow_dispatch:
  push:
    branches:
      - virgool-oct-2026-review
    paths:
      - .github/workflows/prepare-virgool-update.yml

permissions:
  contents: write

concurrency:
  group: virgool-update-review
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image-processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Import new published posts
        run: python scripts/import_virgool.py --archive virgool-export-2026-10-27--glK.zip

      - name: Rebuild tags for all posts using the current relevance rules
        run: python scripts/enrich_post_tags.py

      - name: Optimize eligible large images
        run: python scripts/optimize_large_images.py

      - name: Generate post thumbnails
        run: python scripts/generate_post_thumbnails.py

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Verify Hugo build
        run: hugo --minify --baseURL "https://aliHOZA.github.io/"

      - name: Prepare review artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-artifact/reports

          for file in \
            reports/virgool-import-report.md \
            .github/image-optimization-report.md \
            .github/image-optimization-results.json
          do
            if [ -f "$file" ]; then
              cp --parents "$file" review-artifact/reports/
            fi
          done

          git status --short -- . ':!public' ':!review-artifact' ':!scripts/__pycache__' > review-artifact/working-tree-status.txt

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: virgool-update-review
          path: review-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated content changes to the review branch
        if: success() && github.ref == 'refs/heads/virgool-oct-2026-review'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never commit Hugo's generated public/ output, the report artifact, or Python bytecode.
          git add -A -- . ':!public' ':!review-artifact' ':!scripts/__pycache__'
          if git diff --cached --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "[CHATGPT] Import and optimize new Virgool posts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
