<!doctype html>
<html lang="{{ .Site.Language.Lang | default "fa" }}" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="color-scheme" content="light dark">
  <title>{{ block "title" . }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/editorial.css" | relURL }}">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  {{ block "head" . }}{{ end }}
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="brand-group">
        <a class="brand" href="{{ .Site.Home.RelPermalink }}">
          <span class="brand-mark" aria-hidden="true">ع</span>
          <span class="brand-name">{{ .Site.Title }}</span>
        </a>
        {{ with .Site.Params.description }}<p class="site-description">{{ . }}</p>{{ end }}
      </div>
      <nav class="site-nav" aria-label="ناوبری اصلی">
        <a href="{{ .Site.Home.RelPermalink }}">خانه</a>
        <a href="{{ "search/" | relURL }}">جستجو</a>
        <a href="{{ "tags/" | relURL }}">برچسب‌ها</a>
        <a href="{{ "categories/" | relURL }}">دسته‌بندی‌ها</a>
      </nav>
    </header>
    <main class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>© {{ now.Year }} {{ .Site.Params.author | default .Site.Title }}</span>
      <span>· ساخته‌شده با Hugo</span>
    </footer>
  </div>
</body>
</html>
