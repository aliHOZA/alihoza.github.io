baseURL = 'https://alihoza.github.io/'
languageCode = 'fa'
timeZone = 'Asia/Tehran'
defaultContentLanguage = 'fa'
title = 'وبلاگ علی آقا'
enableRobotsTXT = true

[params]
  description = 'یادداشت‌ها و تحلیل‌هایی درباره اقتصاد ایران، نفت و انرژی، سیاست، تاریخ و جامعه.'
  author = 'علی حسین‌زاده'

  # CHATGPT: GoatCounter and Giscus configured.
  [params.giscus]
    repo = 'aliHOZA/alihoza.github.io'
    repoId = 'R_kgDOQA4KwQ'
    category = 'General'
    categoryId = 'DIC_kwDOQA4Kwc4DJqf3'

  [params.goatcounter]
    code = 'alihoza'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'RSS', 'JSON', 'RANDOMINDEX']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = true
  notAlternative = true

[outputFormats.RANDOMINDEX]
  mediaType = 'application/json'
  baseName = 'random-index'
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
