name: Validate Hugo site

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["theme/editorial-refresh"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "https://aliHOZA.github.io/"

      - name: Verify search index was generated
        run: test -s public/index.json && test -s public/random-index.json && test -s public/search/index.html
