name: Validate Hugo site

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["theme/editorial-refresh", "feature/tfidf-related-posts"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.134.3"
          extended: true

      - name: Build source index
        run: hugo --minify --baseURL "https://aliHOZA.github.io/"

      - name: Generate TF-IDF related-post rankings
        run: python scripts/build_related_posts.py --index public/index.json --output data/related-posts.json

      - name: Build site with related-post rankings
        run: hugo --minify --baseURL "https://aliHOZA.github.io/"

      - name: Verify generated indexes and related-post rankings
        run: |
          test -s public/index.json
          test -s public/random-index.json
          test -s public/search/index.html
          test -s data/related-posts.json
