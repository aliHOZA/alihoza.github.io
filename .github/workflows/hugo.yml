name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Import published Virgool posts", "Vendor Virgool images", "Generate post thumbnails"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: \${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.134.3'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL "https://aliHOZA.github.io/"

      - name: Verify generated indexes and enforce Pages size limit
        run: |
          test -s public/index.json
          test -s public/random-index.json
          bytes=$(du -sb public | cut -f1)
          echo "Published site size: $bytes bytes"
          if [ "$bytes" -gt 1073741824 ]; then
            echo "Published site exceeds GitHub Pages' 1 GiB limit."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: \${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
