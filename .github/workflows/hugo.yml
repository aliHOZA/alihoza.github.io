name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.134.3'
          extended: true

      - name: Install PaperMod theme (alternative method)
        run: |
          mkdir -p themes
          # Use curl + tar instead of git clone to avoid exit code 128 issues
          curl -sL https://github.com/adityatelange/hugo-PaperMod/archive/refs/heads/master.tar.gz | tar -xz --strip-components=1 -C themes
          # Rename the extracted folder
          mv themes/hugo-PaperMod-master themes/PaperMod || mv themes/adityatelange-hugo-PaperMod-* themes/PaperMod || true
          ls -la themes/

      - name: Build site
        run: |
          hugo version
          hugo --minify --baseURL "https://aliHOZA.github.io/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
