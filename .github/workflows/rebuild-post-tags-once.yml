name: One-time rebuild of all post tags

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-post-tags-once.yml"

permissions:
  contents: write

jobs:
  rebuild-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild tags in every Markdown post
        run: python scripts/enrich_post_tags.py
      - name: Commit updated Markdown front matter
        run: |
          if git diff --quiet -- content/posts; then
            echo "All post tags are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/*.md
          git commit -m "[CHATGPT] Rebuild tags in all post Markdown files"
          git push origin HEAD:main
