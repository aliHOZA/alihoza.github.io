baseURL = 'https://aliHOZA.github.io/'
languageCode = 'en-us'
title = 'Ali HOSSEINZADEH Blog'

[module]
  [[module.imports]]
    path = 'github.com/adityatelange/hugo-PaperMod'

[params]
  env = 'production'
  description = 'Personal blog'
  author = 'Ali HOSSEINZADEH'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
