baseURL = 'https://aliHOZA.github.io/'
languageCode = 'fa'
defaultContentLanguage = 'fa'
title = 'وبلاگ علی حسین‌زاده'
enableRobotsTXT = true

[params]
  description = 'یادداشت‌ها و تحلیل‌هایی درباره اقتصاد ایران، نفت و انرژی، سیاست، تاریخ و جامعه.'
  author = 'علی حسین‌زاده'

  # CHATGPT: GoatCounter and Giscus repository ID configured; add the selected Giscus category ID to activate comments.
  [params.giscus]
    repo = 'aliHOZA/alihoza.github.io'
    repoId = 'R_kgDOQA4KwQ'
    category = 'General'
    categoryId = ''

  [params.goatcounter]
    code = 'alihoza'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[outputs]
  home = ['HTML', 'JSON']

[outputFormats.JSON]
  mediaType = 'application/json'
  baseName = 'index'
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
