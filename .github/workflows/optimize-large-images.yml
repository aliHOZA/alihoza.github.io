name: Optimize large images to WebP

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: optimize-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  optimize:
    # Only run for this repository's own branches, not forked PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert large images and update references
        run: python scripts/optimize_large_images.py
      - name: Commit converted images and report
        run: |
          if git diff --quiet; then
            echo "No eligible large images found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert large images to WebP quality 90"
          git push origin "HEAD:${{ github.head_ref }}"
