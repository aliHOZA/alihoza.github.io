baseURL = 'https://aliHOZA.github.io/'
languageCode = 'fa'
title = 'وبلاگ علی حسین‌زاده'
theme = 'PaperMod'

defaultContentLanguage = 'fa'

[languages]
  [languages.fa]
    languageName = 'فارسی'
    languageDirection = 'rtl'
    weight = 1
    title = 'وبلاگ علی حسین‌زاده'

[params]
  env = 'production'
  description = 'وبلاگ شخصی علی حسین‌زاده'
  author = 'علی حسین‌زاده'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  DateFormat = '2 January 2006'

  [params.label]
    text = 'وبلاگ علی حسین‌زاده'

  [params.homeInfoParams]
    Title = 'وبلاگ علی حسین‌زاده'
    Content = 'نوشته‌های من درباره اقتصاد، فناوری، جامعه و زندگی.'

[menu]
  [[menu.main]]
    name = 'نوشته‌ها'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    name = 'آرشیو'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    name = 'برچسب‌ها'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = 'جستجو'
    url = '/search/'
    weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"
  category = "categories"
