name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.134.3'
          extended: true

      - name: Download and install PaperMod theme
        run: |
          mkdir -p themes/PaperMod
          cd /tmp
          curl -sL -o papermod.tar.gz https://github.com/adityatelange/hugo-PaperMod/archive/refs/heads/master.tar.gz
          tar -xzf papermod.tar.gz
          # The extracted folder is usually hugo-PaperMod-master
          cp -r hugo-PaperMod-master/* $GITHUB_WORKSPACE/themes/PaperMod/
          ls -la $GITHUB_WORKSPACE/themes/PaperMod/ | head -10

      - name: Build site
        run: |
          hugo version
          hugo --minify --baseURL "https://aliHOZA.github.io/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
