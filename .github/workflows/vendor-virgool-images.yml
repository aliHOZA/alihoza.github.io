name: Vendor Virgool images

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/vendor_virgool_images.py"
      - ".github/workflows/vendor-virgool-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: virgool-image-vendor
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Archive Virgool-hosted images
        run: python3 scripts/vendor_virgool_images.py

      - name: Commit local images and migration report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts static/images/virgool reports/virgool-image-migration.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "[CHATGPT] Archive Virgool-hosted images locally"
          git push origin HEAD:main
